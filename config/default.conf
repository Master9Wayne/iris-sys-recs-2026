limit_req_zone $binary_remote_addr zone=ip_limit:10m rate=7r/s;


upstream rails_cluster {
    # Added max_fails and fail_timeout for automatic failover 
    server web:3000 max_fails=3 fail_timeout=30s;
}


server {
    listen 80;
    server_name app.localhost; # Route traffic based on subdomain 

    location / {
        limit_req zone=ip_limit burst=15 nodelay;
        limit_req_status 429; # Return 429 when the limit is exceeded 

        proxy_pass http://rails_cluster;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }
}


server {
    listen 80;
    server_name grafana.localhost; 

    location / {

        auth_basic "Restricted Internal Area";
        auth_basic_user_file /etc/nginx/.htpasswd;
        proxy_pass http://grafana:3000;
        proxy_set_header Host $host;
    }
}




server {
    listen 80;
    server_name prometheus.localhost; 

    location / {
       
        auth_basic "Restricted Internal Area";
        auth_basic_user_file /etc/nginx/.htpasswd;
        proxy_pass http://prometheus:9090;
        proxy_set_header Host $host;
    }
}


server {
    listen 8080;
    server_name localhost;

    location /stub_status {
        stub_status on;
        allow all; 
    }
}
