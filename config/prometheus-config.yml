global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['prometheus:9090']

  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']

  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node_exporter:9100']

  - job_name: 'nginx-exporter'
    static_configs:
      - targets: ['nginx_exporter:9113']

  - job_name: 'rails-app'
    metrics_path: '/metrics' 
    dns_sd_configs:
      - names: ['web']
        type: 'A'
        port: 3000
