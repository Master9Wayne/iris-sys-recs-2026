services:
  mysql:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_DATABASE: app_db
      MYSQL_USER: app_user
      MYSQL_PASSWORD: app_pass
      MYSQL_ROOT_PASSWORD: root_secure_password
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - application 

  web:
    build: .
    depends_on:
      - mysql
    deploy:
      replicas: 3 
    environment:
      RAILS_ENV: development
      DB_HOST: mysql
      DB_USER: app_user
      DB_PASSWORD: app_pass
      SECRET_KEY_BASE: "1"
    networks:
      - application
      - storage 
    volumes:
      - nfs_share:/app/public/uploads 

  nfs_server: 
    image: itsthenetwork/nfs-server-alpine:latest
    container_name: nfs_server
    environment:
      SHARED_DIRECTORY: /nfsshare
    volumes:
      - nfs_data:/nfsshare
    networks:
      storage:
        ipv4_address: 10.5.0.5
    privileged: true


  backup:
    image: alpine:latest
    container_name: backup_service
    depends_on:
      - mysql
      - nfs_server
    networks:
      - application
    volumes:
      - ./backup.sh:/backup.sh:ro       
      - ./backups:/backups           
      - nfs_share:/nfsshare:ro        
    command: >
      /bin/sh -c "
        apk add --no-cache mysql-client tar &&
        chmod +x /backup.sh &&
        /backup.sh
      "

  nginx:
    image: nginx:latest
    ports:
      - "80:80" 
      - "443:443"
    volumes:
      - ./config/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./config/.htpasswd:/etc/nginx/.htpasswd:ro
    depends_on:
      - web
    networks:
      - public      
      - application 
      - monitoring 

  prometheus: 
    image: prom/prometheus:latest
    container_name: prometheus

    volumes:
      - ./config/prometheus-config.yml:/etc/prometheus/prometheus.yml
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
    depends_on:
      - web
    networks:
      - monitoring
      - application

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - monitoring

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.47.0
    container_name: cadvisor
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    networks:
      - monitoring

  node-exporter:
    image: prom/node-exporter:latest
    container_name: node_exporter
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.rootfs=/rootfs'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    networks:
      - monitoring

  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:latest
    container_name: nginx_exporter
    command:
      - -nginx.scrape-uri=http://nginx:8080/stub_status
    networks:
      - monitoring

networks:
  public:
    driver: bridge
  application:
    driver: bridge
    internal: true 
  storage:
    driver: bridge
    ipam:
      config:
        - subnet: 10.5.0.0/16
  monitoring:
    driver: bridge
    internal: true

volumes:
  db_data:
  nfs_data: 
  nfs_share: 
    driver: local
    driver_opts:
      type: nfs
      o: addr=10.5.0.5,rw,nolock,hard,nointr,nfsvers=4
      device: ":/" 
  grafana_data:
